name: Build transparency log
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
concurrency:
  group: log
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack tools
        run: |
          if [ -f bundle.zip ]; then unzip -oq bundle.zip; fi
      - name: Build log
        id: build
        env:
          FIRESTORE_API_KEY: ${{ vars.FIRESTORE_API_KEY }}
        run: python3 tools/build_log.py
      - name: Attest checkpoint (Sigstore)
        if: steps.build.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: checkpoints/latest.json
      - name: Commit
        run: |
          git config user.name "safesave-log[bot]"
          git config user.email "log@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            SIZE=$(python3 -c "import json,os;print(json.load(open('checkpoints/latest.json'))['size'] if os.path.exists('checkpoints/latest.json') else 0)")
            git commit -m "log update: size ${SIZE}"
            git push
          fi
